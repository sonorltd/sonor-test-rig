<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>sonor-rig</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#0b0d10;--fg:#e8e6df;--mute:#8a8f98;--accent:#22d3ee}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "DM Sans",system-ui,sans-serif}
  main{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  h1{font-size:44px;margin:0 0 8px;letter-spacing:.02em}
  p{margin:4px 0;color:var(--mute)}
  code{color:var(--accent);font:600 20px/1.4 "DM Mono",ui-monospace,monospace}
  .strip{position:fixed;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#f59e0b,#ef4444,#ec4899,#8b5cf6,#3b82f6,#06b6d4,#10b981,#84cc16,#eab308,#f97316)}
</style></head>
<body><div class="strip"></div>
<main><div>
  <h1>sonor-rig</h1>
  <p>No front app chosen yet. From a terminal or SSH:</p>
  <p><code>sonor-rig use pixel</code> &nbsp;·&nbsp; <code>sonor-rig use fractal</code> &nbsp;·&nbsp; <code>sonor-rig use cbus</code></p>
  <p style="margin-top:16px">This panel switches on its own within a couple of seconds.</p>
</div></main>
</body></html>
